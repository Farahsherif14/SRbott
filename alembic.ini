# Alembic settings. Alembic is the migration tool: see migrations/README.
# The database URL is NOT in this file: migrations/env.py reads DATABASE_URL from .env through
# app/db/session.py. The URL contains the password, and this file is committed.
# Logging is set in env.py too (our setup_logging, which hides the password).

[alembic]
# Where env.py, the template and versions/ are
script_location = %(here)s/migrations
# Put the project root on Python's import path, so env.py can import app.*
# %(here)s = the folder of this file, so Alembic works from any folder ("." = the current folder)
prepend_sys_path = %(here)s
path_separator = os
# File names start with the date and time (laptop time), so they sort in the order they were
# made, e.g. 2026_11_10_1530-3f2a9c1b7d4e_create_tables.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# After `alembic revision` writes a new file, run ruff on it, so it passes CI as it is
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
