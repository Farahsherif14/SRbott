services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://servicebot:servicebot@db:5432/servicebot
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: ["./data:/app/data"]
  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file: .env
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicebot
      POSTGRES_USER: servicebot
      POSTGRES_PASSWORD: servicebot
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
